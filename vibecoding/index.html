<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #6b7280;
      --paper: #fffdf8;
      --line: #e8e1d5;
      --accent: #e76f51;
      --accent-dark: #c9573d;
      --soft-accent: #fff0eb;
      --shadow: 0 24px 60px rgba(93, 67, 43, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 226, 173, 0.65), transparent 27%),
        radial-gradient(circle at 85% 85%, rgba(185, 224, 214, 0.7), transparent 30%),
        #f7f2e9;
      font-family: Georgia, "Times New Roman", serif;
    }

    .app {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 8vw, 3.6rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 16px 0 28px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 26px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
      font: 0.95rem Arial, sans-serif;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.14);
    }

    button {
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: 700 0.9rem Arial, sans-serif;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button {
      padding: 0 20px;
      color: #fff;
      background: var(--accent);
    }

    .add-button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--muted);
      font: 700 0.75rem Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .count {
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--soft-accent);
      letter-spacing: 0;
    }

    .todo-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      animation: appear 220ms ease both;
    }

    .todo-item input[type="checkbox"] {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      box-shadow: none;
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font: 0.98rem/1.4 Arial, sans-serif;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-button {
      padding: 7px 9px;
      color: var(--muted);
      background: transparent;
      font-size: 0.78rem;
    }

    .delete-button:hover {
      color: var(--accent-dark);
      background: var(--soft-accent);
    }

    .empty-message {
      padding: 26px 12px;
      border: 1px dashed var(--line);
      border-radius: 9px;
      color: var(--muted);
      font: 0.9rem/1.5 Arial, sans-serif;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 430px) {
      body { padding: 12px; }
      .app { padding: 28px 20px; }
      .todo-form { flex-direction: column; }
      .add-button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Daily list</p>
    <h1>오늘의 할 일</h1>
    <p class="subtitle">작은 일부터 하나씩, 가볍게 끝내보세요.</p>

    <form class="todo-form" id="todoForm">
      <input id="todoInput" type="text" placeholder="할 일을 입력하세요" autocomplete="off" aria-label="할 일 입력">
      <button class="add-button" type="submit">추가</button>
    </form>

    <div class="list-heading">
      <span>할 일 목록</span>
      <span class="count" id="todoCount">0개</span>
    </div>
    <ul class="todo-list" id="todoList" aria-live="polite"></ul>
  </main>

  <script>
    const todoForm = document.querySelector('#todoForm');
    const todoInput = document.querySelector('#todoInput');
    const todoList = document.querySelector('#todoList');
    const todoCount = document.querySelector('#todoCount');

    function updateCount() {
      const count = todoList.querySelectorAll('.todo-item').length;
      todoCount.textContent = `${count}개`;
    }

    function updateEmptyMessage() {
      const emptyMessage = todoList.querySelector('.empty-message');
      if (todoList.querySelector('.todo-item')) {
        emptyMessage?.remove();
      } else if (!emptyMessage) {
        const message = document.createElement('li');
        message.className = 'empty-message';
        message.textContent = '아직 등록된 할 일이 없어요.';
        todoList.append(message);
      }
    }

    function addTodo(text) {
      const item = document.createElement('li');
      item.className = 'todo-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `${text} 완료`);

      const todoText = document.createElement('span');
      todoText.className = 'todo-text';
      todoText.textContent = text;

      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-button';
      deleteButton.type = 'button';
      deleteButton.textContent = '삭제';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);

      checkbox.addEventListener('change', () => {
        item.classList.toggle('completed', checkbox.checked);
      });

      deleteButton.addEventListener('click', () => {
        item.remove();
        updateCount();
        updateEmptyMessage();
      });

      item.append(checkbox, todoText, deleteButton);
      todoList.append(item);
      updateCount();
      updateEmptyMessage();
    }

    todoForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) {
        todoInput.focus();
        return;
      }

      addTodo(text);
      todoInput.value = '';
      todoInput.focus();
    });

    updateEmptyMessage();
  </script>
</body>
</html>
